<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV App</title>
    <style>
      :root { --primary: #1e90ff; --text: #111; --bg: #fff; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .page-shell { display: grid; place-items: center; height: 100%; }
      .welcome-card { border-radius: 12px; border: 1px solid #e5e7eb; padding: 24px; max-width: 640px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
      .app-title { margin: 0 0 8px; font-size: 28px; }
      .status { display: inline-block; background: var(--primary); color: #fff; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 600; letter-spacing: .3px; }
      .hint { margin: 12px 0 0; color: #555; font-size: 14px; }
      @media (max-width: 640px) { .welcome-card { margin: 0 16px; padding: 20px; } .app-title { font-size: 24px; } }
      /* SkillsSection custom classes */
      .skill-pill { transform: translateY(0) scale(1); background-color: #1e40af; box-shadow: 0 2px 4px rgba(30, 64, 175, 0.3); transition: transform .3s ease, box-shadow .3s ease, background-color .3s ease; }
      .skill-pill--hover { transform: translateY(-3px) scale(1.05); background-color: #1d4ed8; box-shadow: 0 8px 20px rgba(30, 64, 175, 0.4); }
      /* Contact link hover classes for CVHeader */
      .contact-link { display: inline-block; transition: transform .2s ease; transform: scale(1); }
      .contact-link--hover { transform: scale(1.05); }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="page-shell">
      <div id="header-root"></div>
      <section class="welcome-card">
        <h1 class="app-title">CV App</h1>
        <span class="status">Running</span>
        <p class="hint">The server is up. Edit public/index.html to get started.</p>
        <div id="about-root"></div>
        <div id="skills-root"></div>
      </section>
    </main>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-presets="typescript,react">
      const React = window.React;
      type AboutSectionProps = { summary: string };
      function AboutSection({ summary }: AboutSectionProps) {
        if (!summary) return null;
        return (
          <section className="mb-12 text-center">
            <h2 className="mb-4 text-3xl font-semibold text-blue-800">Über mich</h2>
            <p className="mx-auto my-0 text-lg leading-relaxed text-gray-700 max-w-[600px]">{summary}</p>
          </section>
        );
      }
      const mountNode = document.getElementById('about-root');
      if (mountNode) {
        const summary = 'Ich bin ein Full‑Stack‑Entwickler mit Schwerpunkt Frontend, der zugängliche und performante Interfaces baut.';
        if (window.ReactDOM && 'createRoot' in window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.createRoot(mountNode).render(<AboutSection summary={summary} />);
        } else if (window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.render(<AboutSection summary={summary} />, mountNode);
        }
      }

      type PersonalInfo = { fullName: string; jobTitle: string; email: string; phone: string; location: string; profileImage: string };
      type CVHeaderProps = { personalInfo: PersonalInfo };

      function CVHeader({ personalInfo }: CVHeaderProps) {
        const [hoveredElement, setHoveredElement] = React.useState<string | null>(null);
        return (
          <header className="px-0 py-12 text-center bg-blue-800 shadow-[0_4px_6px_rgba(0,0,0,0.1)] text-[white]">
            <div className="px-4 py-0 mx-auto my-0 max-w-[1200px]">
              <div className="flex gap-8 justify-center items-center mb-4 max-sm:flex-col max-sm:gap-4">
                <img alt="Profilbild" className="object-cover rounded-full border-4 border-solid border-white border-opacity-30 h-[150px] shadow-[0_8px_20px_rgba(0,0,0,0.2)] w-[150px] max-sm:h-[120px] max-sm:w-[120px]" src={personalInfo.profileImage} />
                <div className="text-left max-sm:text-center">
                  <h1 className="mx-0 mt-0 mb-2 text-5xl font-[bold] max-sm:text-4xl">{personalInfo.fullName}</h1>
                  <p className="m-0 text-2xl opacity-90 max-sm:text-xl">{personalInfo.jobTitle}</p>
                </div>
              </div>
              <div className="flex flex-wrap gap-8 justify-center text-lg opacity-80">
                <span className={`contact-link ${hoveredElement === 'email' ? 'contact-link--hover' : ''}`} onMouseEnter={() => setHoveredElement('email')} onMouseLeave={() => setHoveredElement(null)}>{personalInfo.email}</span>
                <span className={`contact-link ${hoveredElement === 'phone' ? 'contact-link--hover' : ''}`} onMouseEnter={() => setHoveredElement('phone')} onMouseLeave={() => setHoveredElement(null)}>{personalInfo.phone}</span>
                <span className={`contact-link ${hoveredElement === 'location' ? 'contact-link--hover' : ''}`} onMouseEnter={() => setHoveredElement('location')} onMouseLeave={() => setHoveredElement(null)}>{personalInfo.location}</span>
              </div>
            </div>
          </header>
        );
      }

      const headerMount = document.getElementById('header-root');
      if (headerMount) {
        const personalInfo: PersonalInfo = {
          fullName: 'Yahyav Toumac',
          jobTitle: 'Frontend-Entwickler',
          email: 'yahyav.toumac@example.com',
          phone: '+49 151 23456789',
          location: 'Berlin, Deutschland',
          profileImage: 'images/avatar.svg'
        };
        if (window.ReactDOM && 'createRoot' in window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.createRoot(headerMount).render(<CVHeader personalInfo={personalInfo} />);
        } else if (window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.render(<CVHeader personalInfo={personalInfo} />, headerMount);
        }
      }

      type SkillDetail = { title: string; description: string; details: string[]; image: string };
      type SkillsSectionProps = { skills: string[]; skillDetails: Record<string, SkillDetail> };

      function SkillsSection({ skills, skillDetails }: SkillsSectionProps) {
        const [hoveredElement, setHoveredElement] = React.useState<string | null>(null);
        const [hoveredSkill, setHoveredSkill] = React.useState<string | null>(null);
        if (skills.length === 0) return null;
        return (
          <section className="mb-8">
            <h2 className="pb-2 mb-6 text-3xl font-semibold text-blue-800 border-solid border-b-[3px] border-b-blue-800">Fähigkeiten</h2>
            <div className="flex flex-wrap gap-3 justify-center">
              {skills.map((skill, index) => (
                <div className="inline-block relative" key={skill}>
                  <span
                    className={`inline-block px-6 py-3 text-base font-medium rounded-3xl transition-all cursor-pointer duration-[0.3s] ease-[ease] text-[white] ${hoveredElement === `skill-${index}` ? 'skill-pill skill-pill--hover' : 'skill-pill'}`}
                    onMouseEnter={() => { setHoveredElement(`skill-${index}`); setHoveredSkill(skill); }}
                    onMouseLeave={() => { setHoveredElement(null); setHoveredSkill(null); }}
                  >
                    {skill}
                  </span>
                  {hoveredSkill === skill && skillDetails[skill] && (
                    <div className="absolute top-full left-2/4 p-6 mt-2.5 rounded-xl border-2 border-blue-800 border-solid -translate-x-2/4 bg-[white] max-w-[400px] min-w-[300px] shadow-[0_10px_30px_rgba(0,0,0,0.2)] z-[1000] max-sm:left-0 max-sm:max-w-[300px] max-sm:min-w-[250px]">
                      <div className="flex gap-4 items-center mb-4">
                        <img className="object-contain h-[50px] w-[50px]" src={skillDetails[skill].image} alt={skillDetails[skill].title} />
                        <h3 className="m-0 text-xl font-semibold text-blue-800">{skillDetails[skill].title}</h3>
                      </div>
                      <p className="mb-3 text-base font-medium text-gray-700">{skillDetails[skill].description}</p>
                      <ul className="p-0 m-0">
                        {skillDetails[skill].details.map((detail, detailIndex) => (
                          <li className="relative pl-4 mb-2 text-sm text-gray-600" key={detailIndex}>{detail}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </section>
        );
      }

      const skillsMount = document.getElementById('skills-root');
      if (skillsMount) {
        const skills = ['React', 'TypeScript', 'Tailwind CSS'];
        const skillDetails: Record<string, SkillDetail> = {
          'React': {
            title: 'React',
            description: 'Komponentenbasierte UI-Bibliothek.',
            details: ['Hooks', 'Context', 'React Query'],
            image: 'icons/react.svg'
          },
          'TypeScript': {
            title: 'TypeScript',
            description: 'Typsichere Erweiterung für JavaScript.',
            details: ['Generics', 'Types', 'Interfaces'],
            image: 'icons/ts.svg'
          },
          'Tailwind CSS': {
            title: 'Tailwind CSS',
            description: 'Dienstprogramm-basierte CSS-Bibliothek.',
            details: ['Responsive', 'Variants', 'Plugins'],
            image: 'icons/tailwind.svg'
          }
        };
        if (window.ReactDOM && 'createRoot' in window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.createRoot(skillsMount).render(<SkillsSection skills={skills} skillDetails={skillDetails} />);
        } else if (window.ReactDOM) {
          // @ts-ignore
          window.ReactDOM.render(<SkillsSection skills={skills} skillDetails={skillDetails} />, skillsMount);
        }
      }
    </script>
  </body>
</html>
